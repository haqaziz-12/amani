<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5222A"/>
      <stop offset="100%" stop-color="#8B1A1D"/>
    </linearGradient>
  </defs>
  <!-- Outer pointed ring -->
  <circle cx="100" cy="100" r="95" fill="#2E1114"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#AB2225" stroke-width="6"/>
  <!-- Gold geometric ring -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="#F6EBAA" stroke-width="3"/>
  <!-- Inner red field -->
  <circle cx="100" cy="100" r="58" fill="url(#redGrad)"/>
  <!-- Center star (8-point) -->
  <polygon points="100,55 108,85 140,85 115,105 124,138 100,118 76,138 85,105 60,85 92,85" fill="#F6EBAA"/>
  <!-- Small decorative dots -->
  <circle cx="100" cy="100" r="12" fill="#2F318F"/>
  <circle cx="100" cy="100" r="6" fill="#F6EBAA"/>
</svg>
